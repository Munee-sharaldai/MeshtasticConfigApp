<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meshtastic Manager - Range Test</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Meshtastic Manager</h1>
            <div id="status" class="status-indicator">● Проверка...</div>
        </header>

        <!-- Форма добавления устройства -->
        <section class="card">
            <h2>Форма добавления устройства</h2>
            <form id="addDeviceForm" class="form-inline">
                <input type="text" id="devName" placeholder="Название" required>
                <input type="text" id="devNodeId" placeholder="ID устройства" required>
                <input type="text" id="devDescription" placeholder="Описание">
                <select id="devConnectionType" onchange="toggleConnectionFields()">
                    <option value="wifi">WiFi</option>
                    <option value="serial">USB</option>
                </select>
                <input type="text" id="devIp" placeholder="IP адрес">
                <select id="devSerialPort">
                    <option value="">Выберите порт</option>
                </select>
            </form>
            <div class="addingFormButtons">
                <button type="submit" form="addDeviceForm">Добавить</button>
                <button type="button" onclick="refreshSerialPorts()" class="btn-secondary" id="refreshPortsButton">Обновить список портов</button>
            </div>
        </section>

        <!-- Список устройств -->
        <section class="card">
            <h2>Список добавленных устройств</h2>
            <div id="devicesList" class="devices-grid"></div>
        </section>

        <!-- Упрощённая форма: только Range Test -->
        <section class="card">
            <h2>Параметры устройства</h2>
            <form id="configForm">
                <input type="hidden" id="configIdentifier">
                
                <div class="form-row">
                    <label class="checkbox-label">
                        <input type="checkbox" id="rangeTestEnabled">
                        <span>Range test enabled</span>
                    </label>
                </div>
                
                <button type="submit">Применить</button>
            </form>
        </section>

        <!-- Логи -->
        <section class="card">
            <h2 class="card-header">
                <span class="cardHeaderText">Логи устройства</span>
                <button onclick="refreshLogs()" class="cardHeaderButton">Обновить</button>
                <button onclick="exportAllLogs()" class="cardHeaderButton">Экспорт</button>
            </h2>
            <div id="logsList" class="logs-list"></div>
        </section>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
