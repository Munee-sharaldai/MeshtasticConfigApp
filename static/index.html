<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meshtastic Manager - Range Test</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Meshtastic Manager</h1>
        </header>

        <!-- Форма добавления устройства -->
        <section class="card">
            <h2>Форма добавления устройства</h2>
            <form id="addDeviceForm" class="form-inline">
                <select id="devConnectionType" onchange="toggleConnectionFields()">
                    <option value="wifi">WiFi</option>
                    <option value="serial">USB</option>
                </select>
                <!-- <input type="text" id="devIp" placeholder="IP адрес"> -->
                <select id="devIp" disabled>
                    <option value="">Обновление IP...</option>
                </select>
                <select id="devSerialPort" disabled hidden>
                    <option value="">Обновление портов...</option>
                </select>
            </form>
            <div class="addingFormButtons">
                <button type="submit" form="addDeviceForm">Добавить</button>
                <button type="button" onclick="refreshSerialPorts()" id="refreshPortsButton" hidden>Обновить список портов</button>
                <button type="button" onclick="refreshIPs()" id="refreshIPsButton">Обновить список IP</button>
            </div>
        </section>

        <!-- Список устройств -->
        <div class="devicesAndConfig">
            <section class="card">
                <h2>Список добавленных устройств</h2>
                <div id="devicesList" class="devices-grid">
                     <div class="device-card">
                        Загрузка устройств...
                     </div>
                </div>
            </section>

            <!-- Упрощённая форма: только Range Test -->
            <section id="config-section" class="card">
                <h2 id="config-header">Параметры устройства</h2>
                <input type="hidden" id="configIdentifier">
                <div id="config-forms-container" class="form-content">
                    <form class="config-form">
                        <div class="form-row">
                            Устройство не выбрано
                        </div>
                    </form>
                </div>
            </section>
        </div>
    </div>

    <script src="/static/script.js"></script>

    <!-- Модальное окно просмотра/скачивания логов -->
<div id="logModal" class="modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:1000;">
  <div style="background:white; margin:50px auto; padding:20px; border-radius:8px; max-width:800px; max-height:80vh; display:flex; flex-direction:column;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
      <h3 style="margin:0;">📋 Логи устройства: <span id="logModalIdentifier"></span></h3>
      <button onclick="closeLogModal()" style="background:#e74c3c; color:white; border:none; padding:5px 15px; border-radius:4px; cursor:pointer;">✕</button>
    </div>
    
    <div style="display:flex; gap:10px; margin-bottom:10px;">
      <button id="logStartBtn" onclick="toggleLogRecording()" style="background:#27ae60; color:white; border:none; padding:8px 16px; border-radius:4px; cursor:pointer;">▶️ Начать запись</button>
      <button id="logDownloadBtn" onclick="downloadLogs()" style="background:#3498db; color:white; border:none; padding:8px 16px; border-radius:4px; cursor:pointer;">⬇️ Скачать .txt</button>
      <button onclick="refreshLogs()" style="background:#95a5a6; color:white; border:none; padding:8px 16px; border-radius:4px; cursor:pointer;">🔄 Обновить</button>
    </div>
    
    <div id="logStatus" style="margin-bottom:10px; font-size:0.9em; color:#666;"></div>
    
    <pre id="logContent" style="flex:1; overflow:auto; background:#1e1e1e; color:#d4d4d4; padding:12px; border-radius:4px; font-family:monospace; font-size:0.85em; white-space:pre-wrap;"></pre>
  </div>
</div>
</body>
</html>
