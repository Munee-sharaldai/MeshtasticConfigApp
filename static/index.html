<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meshtastic Manager - Range Test</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Meshtastic Manager</h1>
        </header>

        <!-- Форма добавления устройства -->
        <section class="card">
            <h2>Форма добавления устройства</h2>
            <form id="addDeviceForm" class="form-inline">
                <select id="devConnectionType" onchange="toggleConnectionFields()">
                    <option value="wifi">WiFi</option>
                    <option value="serial">USB</option>
                </select>
                <!-- <input type="text" id="devIp" placeholder="IP адрес"> -->
                <select id="devIp" disabled>
                    <option value="">Обновление IP...</option>
                </select>
                <select id="devSerialPort" disabled hidden>
                    <option value="">Обновление портов...</option>
                </select>
            </form>
            <div class="addingFormButtons">
                <button type="submit" form="addDeviceForm">Добавить</button>
                <button type="button" onclick="refreshSerialPorts()" id="refreshPortsButton" hidden>Обновить список портов</button>
                <button type="button" onclick="refreshIPs()" id="refreshIPsButton">Обновить список IP</button>
            </div>
        </section>

        <!-- Список устройств -->
        <div class="devicesAndConfig">
            <section class="card">
                <h2>Список добавленных устройств</h2>
                <div id="devicesList" class="devices-grid">
                     <div class="device-card">
                        Загрузка устройств...
                     </div>
                </div>
            </section>

            <!-- Упрощённая форма: только Range Test -->
            <section id="config-section" class="card">
                <h2 id="config-header">Параметры устройства</h2>
                <input type="hidden" id="configIdentifier">
                <div id="config-forms-container" class="form-content">
                    <form class="config-form">
                        <div class="form-row">
                            Устройство не выбрано
                        </div>
                    </form>
                </div>
            </section>
        </div>

        <!-- Логи -->
        <section class="card">
            <h2 class="card-header">
                <span class="cardHeaderText">Логи устройства</span>
                <button onclick="refreshLogs()" class="cardHeaderButton">Обновить</button>
                <button onclick="exportAllLogs()" class="cardHeaderButton">Экспорт</button>
            </h2>
            <div id="logsList" class="logs-list"></div>
        </section>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
